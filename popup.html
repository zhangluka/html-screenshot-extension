<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 220px;
    padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #faf9f5;
    color: #141413;
  }
  h1 {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 12px;
    letter-spacing: -0.01em;
  }
  .ratios {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
  }
  .ratio-btn {
    flex: 1;
    min-width: 48px;
    padding: 6px 0;
    border: 1px solid rgba(20,20,19,0.1);
    border-radius: 4px;
    background: #fff;
    color: #141413;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .ratio-btn:hover { border-color: rgba(20,20,19,0.2); }
  .ratio-btn.active {
    background: #141413;
    color: #faf9f5;
    border-color: #141413;
  }
  .custom-row {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-bottom: 12px;
  }
  .custom-row input {
    width: 50px;
    padding: 4px 6px;
    border: 1px solid rgba(20,20,19,0.1);
    border-radius: 4px;
    font-size: 12px;
    text-align: center;
    background: #fff;
  }
  .custom-row input:focus {
    outline: none;
    border-color: #d97757;
  }
  .custom-row span {
    font-size: 12px;
    color: #87867f;
  }
  .btn-row {
    display: flex;
    gap: 6px;
  }
  .btn {
    flex: 1;
    padding: 8px 0;
    border: none;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-preview {
    background: #fff;
    color: #141413;
    border: 1px solid rgba(20,20,19,0.15);
  }
  .btn-preview:hover { border-color: rgba(20,20,19,0.3); }
  .btn-capture {
    background: #141413;
    color: #faf9f5;
  }
  .btn-capture:hover { background: #3d3d3a; }
  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
</style>
</head>
<body>
  <h1>Screenshot</h1>
  <div class="ratios">
    <button class="ratio-btn active" data-ratio="16:9">16:9</button>
    <button class="ratio-btn" data-ratio="4:3">4:3</button>
    <button class="ratio-btn" data-ratio="5:2">5:2</button>
    <button class="ratio-btn" data-ratio="1:1">1:1</button>
  </div>
  <div class="custom-row">
    <input type="number" id="cw" value="16" min="1" max="100">
    <span>:</span>
    <input type="number" id="ch" value="9" min="1" max="100">
  </div>
  <div class="btn-row">
    <button class="btn btn-preview" id="preview">Preview</button>
    <button class="btn btn-capture" id="capture">Capture</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
